name: Update pub.dev Statistics

on:
  schedule:
    # Runs daily at 03:00 UTC (05:00 Cairo time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-pub-stats.yml'

permissions:
  contents: write

jobs:
  sync-pub-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch live metrics & rebuild packages-animated.svg
        run: node scripts/update-pub-stats.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/packages-animated.svg README.md
          if git diff --staged --quiet; then
            echo "No changes in pub.dev statistics detected."
          else
            git commit -m "chore: sync live pub.dev statistics [skip ci]"
            git push
          fi
