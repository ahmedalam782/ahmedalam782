<svg width="100%" height="100%" viewBox="0 0 920 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pheader-bg" x1="0" y1="0" x2="920" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="pheader-line-grad" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF5C8D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="pheader-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(460 60) scale(260 50)">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <pattern id="pheader-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#701A3D" stroke-opacity="0.1" stroke-width="1" />
    </pattern>

    <linearGradient id="pheader-text-grad" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F0F3" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>
  </defs>

  <style>
    .mono-font { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="920" height="120" rx="10" fill="url(#pheader-bg)" />
  <rect width="920" height="120" rx="10" fill="url(#pheader-grid)" />
  <rect x="1" y="1" width="918" height="118" rx="9" fill="none" stroke="#451126" stroke-width="1" stroke-opacity="0.6" />

  <!-- Center Ambient Glow -->
  <ellipse cx="460" cy="60" rx="220" ry="35" fill="url(#pheader-glow)" />

  <!-- Animated Boundary Laser Line -->
  <path d="M 50 110 L 870 110" stroke="url(#pheader-line-grad)" stroke-width="1.8" stroke-dasharray="140 240" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="600; 0; -600" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Left Rotating Crosshair Ring -->
  <g transform="translate(68, 60)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="6 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="16 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#E5B5C7" />
  </g>

  <!-- Right Rotating Crosshair Ring -->
  <g transform="translate(852, 60)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="6 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="16 8" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="#E5B5C7" />
  </g>

  <!-- Header Content -->
  <!-- Top Monospace Tag -->
  <g transform="translate(116, 26)">
    <!-- Pulsing Live Dot -->
    <circle cx="6" cy="8" r="4" fill="#C77B9B">
      <animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="12" fill="#C77B9B" font-size="11" font-weight="600" letter-spacing="1.4" class="mono-font">VERIFIED STORE DEPLOYMENTS · 7+ PRODUCTION APPLICATIONS</text>
  </g>

  <!-- Main Headline Title -->
  <text x="116" y="68" fill="url(#pheader-text-grad)" font-size="24" font-weight="800" letter-spacing="-0.2" class="sans-font">
    FEATURED MOBILE APPLICATIONS
  </text>

  <!-- Subtitle Description -->
  <text x="116" y="90" fill="#E5B5C7" font-size="12.5" font-weight="500" opacity="0.85" class="sans-font">
    E-Commerce, Multi-App Transportation, Healthcare EHR &amp; EdTech Platforms
  </text>
</svg>
