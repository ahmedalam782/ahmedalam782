<svg width="100%" height="100%" viewBox="0 0 920 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="920" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="footer-line-grad" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="20%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="80%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="footer-pulse-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(460 20) scale(120 40)">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono-font { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="110" rx="10" fill="url(#footer-bg)" />
  <rect x="1" y="1" width="918" height="108" rx="9" fill="none" stroke="#451126" stroke-width="1" stroke-opacity="0.6" />

  <!-- Center Ambient Glow -->
  <ellipse cx="460" cy="20" rx="140" ry="24" fill="url(#footer-pulse-glow)" />

  <!-- Animated Top Boundary Flow Line -->
  <line x1="60" y1="20" x2="860" y2="20" stroke="url(#footer-line-grad)" stroke-width="1.6" />

  <!-- Central Pulsing Node -->
  <circle cx="460" cy="20" r="5" fill="#C77B9B">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="460" cy="20" r="11" fill="none" stroke="#E5B5C7" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="5;14;18" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.2;0" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Editorial Quote & Sign-off -->
  <text x="460" y="56" text-anchor="middle" fill="#F8F0F3" font-size="14" font-weight="500" class="sans-font">
    "Architecting resilient mobile ecosystems — built with precision, shipped with purpose."
  </text>

  <!-- Monospace Sub-bar -->
  <text x="460" y="84" text-anchor="middle" fill="#C77B9B" font-size="11" font-weight="600" letter-spacing="1.5" class="mono-font">
    BENHA, EGYPT 🇪🇬 · OPEN TO GLOBAL REMOTE CONTRACTS &amp; ROLES · AHMED MOHAMED OSMAN
  </text>
</svg>
