<svg width="100%" height="100%" viewBox="0 0 880 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skills-bg" x1="0" y1="0" x2="880" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="skills-border" x1="0" y1="0" x2="880" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="card-border" x1="0" y1="0" x2="260" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="skills-laser" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF5C8D" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="skills-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 100) scale(320 90)">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <pattern id="skills-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#701A3D" stroke-opacity="0.09" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="200" rx="12" fill="url(#skills-bg)" />
  <rect width="880" height="200" rx="12" fill="url(#skills-grid)" />
  <rect x="1" y="1" width="878" height="198" rx="11" fill="none" stroke="url(#skills-border)" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <ellipse cx="440" cy="100" rx="320" ry="70" fill="url(#skills-glow)" />

  <!-- Animated Bottom Laser -->
  <path d="M 32 190 L 848 190" stroke="url(#skills-laser)" stroke-width="1.8" stroke-dasharray="150 220" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="740; 0; -740" dur="5.5s" repeatCount="indefinite" />
  </path>

  <!-- Header Row -->
  <g transform="translate(32, 22)">
    <!-- Pulsing Live Dot -->
    <circle cx="6" cy="6" r="3.5" fill="#C77B9B">
      <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#E5B5C7" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono">
      SYSTEM ARCHITECTURE &amp; TECHNICAL CAPABILITIES
    </text>

    <!-- Right rotating constellation -->
    <g transform="translate(795, 8)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#701A3D" stroke-width="1" stroke-dasharray="6 3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="3" fill="#C77B9B" />
      <circle cx="10" cy="0" r="1.8" fill="#F8F0F3" />
    </g>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(32, 54)">
    <text x="0" y="0" fill="#FFFFFF" font-size="19" font-weight="800" class="sans">
      Enterprise Engineering &amp; High-Throughput Mobile Stacks
    </text>
    <text x="560" y="0" fill="#C77B9B" font-size="11" font-weight="600" class="mono">
      SOLID · CLEAN ARCH · TDD
    </text>
  </g>

  <!-- 3 Pillar Skill Cards -->
  <!-- Card 1: Mobile & Architecture -->
  <g transform="translate(32, 74)">
    <rect width="258" height="98" rx="8" fill="#190B12" fill-opacity="0.8" />
    <rect width="258" height="98" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1" />
    
    <text x="16" y="24" fill="#F8F0F3" font-size="12" font-weight="700" class="sans">📱 Mobile &amp; Architecture</text>
    <text x="16" y="44" fill="#E5B5C7" font-size="9.5" font-weight="600" class="mono">Flutter 3.x · Dart · C#</text>
    <text x="16" y="62" fill="#C77B9B" font-size="9" font-weight="500" class="mono">Clean Architecture · MVVM</text>
    <text x="16" y="80" fill="#F8F0F3" font-size="9" font-weight="700" class="mono">BLoC · Cubit · GetIt (DI)</text>
  </g>

  <!-- Card 2: Cloud, APIs & Geo -->
  <g transform="translate(306, 74)">
    <rect width="258" height="98" rx="8" fill="#190B12" fill-opacity="0.8" />
    <rect width="258" height="98" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1" />

    <text x="16" y="24" fill="#F8F0F3" font-size="12" font-weight="700" class="sans">🌐 Cloud, APIs &amp; Telemetry</text>
    <text x="16" y="44" fill="#E5B5C7" font-size="9.5" font-weight="600" class="mono">Firebase (Firestore, FCM, Auth)</text>
    <text x="16" y="62" fill="#C77B9B" font-size="9" font-weight="500" class="mono">REST APIs (Dio) · WebSockets</text>
    <text x="16" y="80" fill="#F8F0F3" font-size="9" font-weight="700" class="mono">Google Maps SDK · OSM / GPS</text>
  </g>

  <!-- Card 3: DevOps & Quality Assurance -->
  <g transform="translate(580, 74)">
    <rect width="268" height="98" rx="8" fill="#190B12" fill-opacity="0.8" />
    <rect width="268" height="98" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1" />

    <text x="16" y="24" fill="#F8F0F3" font-size="12" font-weight="700" class="sans">⚙️ DevOps &amp; Quality</text>
    <text x="16" y="44" fill="#E5B5C7" font-size="9.5" font-weight="600" class="mono">GitHub Actions CI/CD (-5 hrs/wk)</text>
    <text x="16" y="62" fill="#C77B9B" font-size="9" font-weight="500" class="mono">85% Automated Widget Tests</text>
    <text x="16" y="80" fill="#4ADE80" font-size="9" font-weight="700" class="mono">Play Console · App Store Connect</text>
  </g>
</svg>
