<svg width="100%" height="100%" viewBox="0 0 920 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0" y1="0" x2="920" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="45%" stop-color="#190B12" />
      <stop offset="85%" stop-color="#14080F" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Radial Glow Orbs -->
    <radialGradient id="glow-wine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 126) rotate(90) scale(180 220)">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-rose" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 80) rotate(90) scale(160 200)">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#451126" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accent Gradients -->
    <linearGradient id="text-title-grad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8F0F3" />
      <stop offset="85%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#C77B9B" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="25%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FF5C8D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-border-grad" x1="0" y1="0" x2="195" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Fine Technical Grid Pattern -->
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#701A3D" stroke-opacity="0.12" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#C77B9B" fill-opacity="0.25" />
    </pattern>

    <!-- Soft Filter for High-Impact Elements -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-font { font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="920" height="350" rx="14" fill="url(#hero-bg)" />
  <rect width="920" height="350" rx="14" fill="url(#tech-grid)" />

  <!-- Ambient Wine & Rose Glows -->
  <circle cx="770" cy="126" r="180" fill="url(#glow-wine)" />
  <circle cx="180" cy="80" r="160" fill="url(#glow-rose)" />

  <!-- Outer Elegant Frame -->
  <rect x="1" y="1" width="918" height="348" rx="13" fill="none" stroke="#451126" stroke-width="1.2" stroke-opacity="0.75" />
  <rect x="6" y="6" width="908" height="338" rx="9" fill="none" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Technical Corner Marks -->
  <path d="M 18 28 L 18 18 L 28 18" stroke="#C77B9B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 902 28 L 902 18 L 892 18" stroke="#C77B9B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 18 322 L 18 332 L 28 332" stroke="#C77B9B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 902 322 L 902 332 L 892 332" stroke="#C77B9B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Orbital Right-Side Constellation Geometry (Restrained & Padded) -->
  <g transform="translate(770, 126)">
    <!-- Outer Orbit Arc -->
    <circle cx="0" cy="0" r="86" fill="none" stroke="#701A3D" stroke-width="1.2" stroke-dasharray="12 6" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite" />
    </circle>

    <!-- Mid Orbit Ring with Accent Nodes -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#C77B9B" stroke-width="1.3" stroke-dasharray="60 25 15 20" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#E5B5C7" stroke-width="1" stroke-dasharray="5 4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>

    <!-- Center Nucleus Glow -->
    <circle cx="0" cy="0" r="22" fill="#451126" opacity="0.8" />
    <circle cx="0" cy="0" r="11" fill="#701A3D">
      <animate attributeName="r" values="10;13;10" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="5" fill="#F8F0F3" />

    <!-- Satellite Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite" />
      <circle cx="64" cy="0" r="3.8" fill="#E5B5C7" filter="url(#soft-glow)" />
      <circle cx="-64" cy="0" r="2.6" fill="#C77B9B" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="38s" repeatCount="indefinite" />
      <circle cx="0" cy="86" r="3" fill="#C77B9B" />
      <circle cx="0" cy="-86" r="3" fill="#F8F0F3" />
    </g>

    <!-- Crosshair Target -->
    <line x1="-98" y1="0" x2="-75" y2="0" stroke="#701A3D" stroke-width="1" opacity="0.4" />
    <line x1="75" y1="0" x2="98" y2="0" stroke="#701A3D" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-98" x2="0" y2="-75" stroke="#701A3D" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="75" x2="0" y2="98" stroke="#701A3D" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Animated Laser Trace Line (Clear of Cards and Text) -->
  <path d="M 46 230 L 360 230 L 410 244 L 874 244" fill="none" stroke="url(#laser-grad)" stroke-width="1.6" stroke-dasharray="140 260" stroke-linecap="round" opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="800; 0; -800" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Left Content Column -->
  <!-- Status Badge Pill -->
  <g transform="translate(46, 32)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <!-- Pulsing Live Dot -->
    <circle cx="15" cy="13" r="4.5" fill="#C77B9B">
      <animate attributeName="r" values="3.5;6;3.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="13" r="8" fill="none" stroke="#E5B5C7" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="4;10;13" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" fill="#E5B5C7" font-size="11" font-weight="600" letter-spacing="1.2" class="mono-font">FLUTTER ARCHITECT · OPEN-SOURCE</text>
  </g>

  <!-- Main Headline Name -->
  <text x="46" y="102" fill="url(#text-title-grad)" font-size="34" font-weight="800" letter-spacing="-0.3" class="sans-font">AHMED MOHAMED OSMAN</text>
  <text x="46" y="126" fill="#C77B9B" font-size="15" font-weight="600" letter-spacing="0.8" class="mono-font">@ahmedalam782 · "Ahmed Alam"</text>

  <!-- Glowing Underline Accent -->
  <path d="M 46 138 L 480 138" stroke="#451126" stroke-width="2" />
  <path d="M 46 138 L 260 138" stroke="url(#laser-grad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="40 180; 160 60; 40 180" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Editorial Role Line & Bio (Spaced to avoid orbit collision) -->
  <text x="46" y="168" fill="#F8F0F3" font-size="14.5" font-weight="600" class="sans-font">
    Mobile Systems Specialist · Clean Architecture · BLoC · High-Performance
  </text>
  <text x="46" y="192" fill="#E5B5C7" font-size="13" font-weight="400" opacity="0.9" class="sans-font">
    Benha University (B.Sc. CS) · Author of adaptive_video_player &amp; osm_location_picker
  </text>

  <!-- Bottom Metric Cards Strip (Evenly spaced & padded) -->
  <!-- Card 1: 7+ Production Apps -->
  <g transform="translate(46, 260)">
    <rect x="0" y="0" width="195" height="60" rx="8" fill="#190B12" fill-opacity="0.9" stroke="url(#card-border-grad)" stroke-width="1" />
    <text x="14" y="26" fill="#F8F0F3" font-size="16" font-weight="700" class="sans-font">7+ Apps Shipped</text>
    <text x="14" y="45" fill="#C77B9B" font-size="10.5" font-weight="500" class="mono-font">Google Play &amp; App Store</text>
  </g>

  <!-- Card 2: 160/160 Pub Points -->
  <g transform="translate(257, 260)">
    <rect x="0" y="0" width="195" height="60" rx="8" fill="#190B12" fill-opacity="0.9" stroke="url(#card-border-grad)" stroke-width="1" />
    <text x="14" y="26" fill="#F8F0F3" font-size="16" font-weight="700" class="sans-font">160 / 160 Points</text>
    <text x="14" y="45" fill="#C77B9B" font-size="10.5" font-weight="500" class="mono-font">pub.dev Open Source</text>
  </g>

  <!-- Card 3: 30% Load Optimization -->
  <g transform="translate(468, 260)">
    <rect x="0" y="0" width="195" height="60" rx="8" fill="#190B12" fill-opacity="0.9" stroke="url(#card-border-grad)" stroke-width="1" />
    <text x="14" y="26" fill="#F8F0F3" font-size="16" font-weight="700" class="sans-font">-30% Startup Time</text>
    <text x="14" y="45" fill="#C77B9B" font-size="10.5" font-weight="500" class="mono-font">Balsan Lazy Loading</text>
  </g>

  <!-- Card 4: CI/CD Efficiency -->
  <g transform="translate(679, 260)">
    <rect x="0" y="0" width="195" height="60" rx="8" fill="#190B12" fill-opacity="0.9" stroke="url(#card-border-grad)" stroke-width="1" />
    <text x="14" y="26" fill="#F8F0F3" font-size="16" font-weight="700" class="sans-font">5+ Hrs / Wk Saved</text>
    <text x="14" y="45" fill="#C77B9B" font-size="10.5" font-weight="500" class="mono-font">GitHub Actions CI/CD</text>
  </g>
</svg>
